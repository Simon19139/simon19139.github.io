<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>全媒体运营师 - 备考神器</title>
<style>
:root{--primary:#1a365d;--primary-light:#2c5282;--accent:#d69e2e;--bg:#f7fafc;--card:#fff;--text:#2d3748;--text-light:#718096;--success:#38a169;--error:#e53e3e;--border:#e2e8f0;--shadow:0 1px 3px rgba(0,0,0,.1)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-tap-highlight-color:transparent}
.header{position:fixed;top:0;left:0;right:0;height:52px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 16px;z-index:100;box-shadow:0 2px 4px rgba(0,0,0,.15)}
.header h1{font-size:17px;font-weight:600}
.header-btn{background:none;border:none;color:#fff;font-size:20px;cursor:pointer;padding:6px 10px;border-radius:6px}
.header-btn:active{background:rgba(255,255,255,.15)}
.main{margin-top:52px;padding-bottom:calc(60px + env(safe-area-inset-bottom, 0px))}
.tab-bar{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);display:flex;z-index:100;padding-bottom:env(safe-area-inset-bottom,0px)}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer;color:var(--text-light);transition:color .2s;padding:6px 0 8px;min-width:0;overflow:hidden}
.tab-item.active{color:var(--primary)}
.tab-item .icon{font-size:16px;line-height:1}
.tab-item .label{font-size:9px;line-height:1;white-space:nowrap}
.page{display:none}.page.active{display:block}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px;padding:0}
.stat-card{background:var(--card);border-radius:10px;padding:14px;box-shadow:var(--shadow)}
.stat-card .num{font-size:26px;font-weight:700;color:var(--primary)}
.stat-card .label{font-size:12px;color:var(--text-light)}
.stat-card.accent .num{color:var(--accent)}
.stat-card.success .num{color:var(--success)}
.stat-card.error .num{color:var(--error)}
.exam-btn{display:block;width:calc(100% - 32px);margin:8px 16px;padding:14px;background:var(--primary);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;text-align:center}
.exam-btn:active{background:var(--primary-light)}
.exam-btn.gold{background:var(--accent);color:#1a202c}
.exam-btn.green{background:var(--success);color:#fff}
.exam-btn.red{background:var(--error);color:#fff}
.filter-bar{display:flex;gap:6px;padding:10px 16px;overflow-x:auto;-webkit-overflow-scrolling:touch;flex-wrap:nowrap}
.filter-chip{white-space:nowrap;padding:6px 12px;border-radius:16px;font-size:13px;background:var(--card);border:1px solid var(--border);cursor:pointer;transition:all .2s}
.filter-chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.question-card{background:var(--card);margin:8px 12px;border-radius:10px;padding:16px;box-shadow:var(--shadow)}
.q-meta{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.q-tag{font-size:11px;padding:2px 8px;border-radius:10px;background:#edf2f7;color:var(--text-light)}
.q-tag.module{background:#ebf8ff;color:#2b6cb0}
.q-tag.verified{background:#f0fff4;color:#276749}
.q-tag.ai{background:#fffaf0;color:#975a16}
.q-tag.done-tag{background:#e9d8fd;color:#553c9a}
.q-content{font-size:15px;margin-bottom:12px;line-height:1.7}
.options{display:flex;flex-direction:column;gap:8px}
.option-btn{display:flex;align-items:flex-start;gap:8px;padding:10px 12px;border:1.5px solid var(--border);border-radius:8px;background:var(--card);cursor:pointer;font-size:14px;text-align:left;transition:all .15s}
.option-btn:active{transform:scale(.98)}
.option-btn .letter{min-width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:12px;background:#edf2f7;color:var(--text);flex-shrink:0}
.option-btn.selected{border-color:var(--primary-light);background:#ebf8ff}
.option-btn.selected .letter{background:var(--primary);color:#fff}
.option-btn.correct{border-color:var(--success);background:#f0fff4}
.option-btn.correct .letter{background:var(--success);color:#fff}
.option-btn.wrong{border-color:var(--error);background:#fff5f5}
.option-btn.wrong .letter{background:var(--error);color:#fff}
.judge-btns{display:flex;gap:10px}
.judge-btn{flex:1;padding:12px;border:1.5px solid var(--border);border-radius:8px;background:var(--card);cursor:pointer;font-size:15px;font-weight:600;text-align:center}
.judge-btn.selected{border-color:var(--primary-light);background:#ebf8ff;color:var(--primary)}
.judge-btn.correct{border-color:var(--success);background:#f0fff4;color:var(--success)}
.judge-btn.wrong{border-color:var(--error);background:#fff5f5;color:var(--error)}
.answer-reveal{margin-top:10px;padding:10px 12px;border-radius:8px;background:#fffff0;border:1px solid #fefcbf;font-size:13px;color:#744210}
.answer-badge{display:inline-block;padding:1px 6px;border-radius:4px;font-size:11px;margin-right:4px}
.answer-badge.standard{background:#c6f6d5;color:#276749}
.answer-badge.ai-ref{background:#fefcbf;color:#975a16}
.explanation-box{margin-top:8px;padding:10px 12px;border-radius:8px;background:#f0f9ff;border:1px solid #bee3f8;font-size:13px;color:#2b6cb0;line-height:1.6;display:none}
.explanation-box.ai{background:#fffaf0;border-color:#fefcbf;color:#744210}
.q-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.q-action-btn{padding:6px 12px;border:1px solid var(--border);border-radius:6px;background:var(--card);cursor:pointer;font-size:12px;color:var(--text-light)}
.q-action-btn.active{border-color:var(--accent);color:var(--accent);background:#fffff0}
.nav-row{display:flex;justify-content:space-between;align-items:center;padding:8px 12px}
.nav-btn{padding:8px 16px;border:1px solid var(--border);border-radius:8px;background:var(--card);cursor:pointer;font-size:14px}
.nav-btn:disabled{opacity:.4;cursor:default}
.nav-counter{font-size:13px;color:var(--text-light)}
.exam-header{background:var(--primary);color:#fff;padding:12px 16px;text-align:center;position:fixed;top:0;left:0;right:0;z-index:200}
.exam-timer{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.exam-progress{font-size:13px;opacity:.8;margin-top:4px}
.exam-submit{display:block;width:calc(100% - 24px);margin:16px 12px;padding:14px;background:var(--accent);color:#1a202c;border:none;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer}
.result-card{background:var(--card);margin:10px 12px;border-radius:10px;padding:20px;box-shadow:var(--shadow);text-align:center}
.result-score{font-size:48px;font-weight:800;color:var(--primary)}
.result-detail{font-size:14px;color:var(--text-light);margin-top:8px}
.drawer-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:150}
.drawer-overlay.active{display:block}
.drawer{position:fixed;top:0;right:-280px;width:280px;height:100%;background:var(--card);z-index:160;transition:right .3s;padding:16px;overflow-y:auto}
.drawer.active{right:0}
.drawer h3{font-size:16px;margin-bottom:12px;color:var(--primary)}
.drawer-item{padding:10px 0;border-bottom:1px solid var(--border);font-size:14px}
.drawer-close{position:absolute;top:12px;right:12px;background:none;border:none;font-size:24px;cursor:pointer;color:var(--text-light)}
.note{padding:16px;font-size:13px;color:var(--text-light);line-height:1.6}
.note b{color:var(--text)}
.progress-bar{height:8px;background:#edf2f7;border-radius:4px;margin:12px 16px;overflow:hidden}
.progress-bar .fill{height:100%;border-radius:4px;transition:width .3s}
.progress-bar .fill.green{background:var(--success)}
.progress-bar .fill.gold{background:var(--accent)}
.multi-submit{display:block;width:calc(100% - 32px);margin:8px 16px;padding:12px;background:var(--primary);color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer}
.sync-section{margin:12px 16px;padding:14px;background:var(--card);border-radius:10px;box-shadow:var(--shadow)}
.sync-section h4{font-size:14px;color:var(--primary);margin-bottom:8px}
.sync-btn{display:inline-block;padding:8px 14px;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;margin:4px 2px}
.sync-btn.export{background:var(--primary);color:#fff}
.sync-btn.import{background:var(--accent);color:#1a202c}
.sync-btn:active{opacity:.8}
.sync-code-area{width:100%;min-height:60px;max-height:120px;padding:8px;border:1px solid var(--border);border-radius:8px;font-size:11px;font-family:monospace;resize:vertical;margin:8px 0}
.sync-tip{font-size:11px;color:var(--text-light);margin-top:4px;line-height:1.5}.sync-indicator{display:inline-block;margin-left:8px;cursor:pointer}
.sync-dot{width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:4px}
.sync-dot.ok{background:#38a169}.sync-dot.syncing{background:#3182ce;animation:pulse 1s infinite}
.sync-dot.error{background:#e53e3e}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.cloud-status{font-size:11px;color:#718096;padding:2px 8px;border-radius:4px;cursor:pointer}
.cloud-status:hover{background:#edf2f7}
.user-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;background:#ebf8ff;border-radius:10px;font-size:11px;color:#2b6cb0;cursor:pointer}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;justify-content:center;align-items:center}
.modal-overlay.active{display:flex}
.modal-box{background:var(--card);border-radius:14px;padding:20px;width:calc(100% - 32px);max-width:400px;max-height:80vh;overflow-y:auto}
.modal-box h3{font-size:16px;color:var(--primary);margin-bottom:12px}
.modal-close{float:right;background:none;border:none;font-size:20px;cursor:pointer;color:var(--text-light)}

/* 版本徽章样式 */
.version-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600;margin-left:6px}
.version-badge.free{background:#e2e8f0;color:#4a5568}
.version-badge.full{background:#c6f6d5;color:#276749}
/* 锁定tab样式 */
.tab-item.locked{color:#a0aec0;cursor:not-allowed}
.tab-item.locked .icon{opacity:0.6}
/* 锁定chip样式 */
.filter-chip.locked{opacity:0.5;cursor:not-allowed;position:relative}
.filter-chip.locked:active{transform:none}
/* 锁定提示页面 */
.lock-screen{text-align:center;padding:40px 20px}
.lock-screen .lock-icon{font-size:64px;margin-bottom:16px}
.lock-screen h3{font-size:20px;color:#1a365d;margin-bottom:8px}
.lock-screen p{color:#718096;font-size:14px;margin-bottom:16px}
/* 密钥输入框样式 */
.key-input{width:100%;padding:12px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:16px;outline:none;text-align:center;letter-spacing:2px}
.key-input:focus{border-color:#1a365d}
/* 手机号输入样式 */
.phone-input{width:100%;padding:12px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:16px;outline:none;text-align:center}
.phone-input:focus{border-color:#1a365d}


/* 题库切换样式 */
.bank-selector{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:6px;font-size:13px;cursor:pointer;white-space:nowrap;background:rgba(255,255,255,.15);color:#fff;font-weight:600;border:1px solid rgba(255,255,255,.2);transition:background .2s}
.bank-selector:active{background:rgba(255,255,255,.25)}
.bank-arrow{font-size:8px;opacity:.7;margin-left:2px}
/* 题库下拉菜单 */
.bank-menu{display:none;position:fixed;top:52px;left:12px;background:#fff;border-radius:10px;box-shadow:0 4px 20px rgba(0,0,0,.2);z-index:250;overflow:hidden;min-width:180px}
.bank-menu.active{display:block}
.bank-menu-item{padding:12px 16px;font-size:14px;color:#2d3748;cursor:pointer;display:flex;align-items:center;gap:8px;transition:background .15s}
.bank-menu-item:active{background:#f0f4f8}
.bank-menu-item.current{color:#1a365d;font-weight:700;background:#ebf8ff}
.bank-menu-item .check{font-size:14px;color:#38a169}
.bank-menu-item .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.bank-menu-overlay{display:none;position:fixed;inset:0;z-index:240}
.bank-menu-overlay.active{display:block}
</style>
</head>
<body>

<div class="header">
  <h1 style="font-size:14px;display:flex;align-items:center;gap:4px;flex-wrap:nowrap">📚<span id="bankSelector" class="bank-selector" onclick="showBankMenu()"><span id="bankName">创意策划三级</span><span class="bank-arrow">▼</span></span><span id="versionBadge" class="version-badge"></span><span id="headerUser" class="user-badge" onclick="toggleDrawer();showUserSwitch()" style="font-size:11px;font-weight:400"></span><span id="syncIndicator" class="sync-indicator" onclick="openSyncModal()"></span></h1>
  <button class="header-btn" onclick="toggleDrawer()">☰</button>
</div>

<div class="bank-menu-overlay" id="bankMenuOverlay" onclick="closeBankMenu()"></div>
<div class="bank-menu" id="bankMenu"></div>
<div class="drawer-overlay" id="drawerOverlay" onclick="toggleDrawer()"></div>
<div class="drawer" id="drawer">
  <button class="drawer-close" onclick="toggleDrawer()">✕</button>
  <h3>题库信息</h3>
  <div class="drawer-item" id="drawerInfo">加载中...</div>
  <h3 style="margin-top:16px">📚 题库</h3>
  <div class="drawer-item" style="color:var(--primary);cursor:pointer" onclick="toggleDrawer();switchBank('cy')">📋 创意策划三级</div>
  <div class="drawer-item" style="color:var(--primary);cursor:pointer" onclick="toggleDrawer();switchBank('zb')">📺 直播运营三级</div>
  <h3 style="margin-top:16px">👤 用户</h3>
  <div class="drawer-item" id="drawerUser" style="color:var(--primary);cursor:pointer" onclick="toggleDrawer();showUserSwitch()">切换账号</div>
  <div class="drawer-item" id="drawerKeyMenu" style="color:var(--accent);cursor:pointer;display:none" onclick="toggleDrawer();showKeyInputModal()">🔑 输入密钥</div>
  <h3 style="margin-top:16px">数据同步</h3>
  <div class="drawer-item" style="color:var(--primary);cursor:pointer" onclick="openSyncModal()">☁️ 同步进度</div>
  <div class="drawer-item" style="color:var(--text-light);font-size:12px;cursor:default" id="drawerSyncInfo">自动云同步已开启</div>
  <h3 style="margin-top:16px">操作</h3>
  <div class="drawer-item" style="color:var(--error);cursor:pointer" onclick="if(confirm('确定清除当前题库所有学习记录？')){localStorage.removeItem('qbank_v7_'+currentBankId+'_'+getCurrentPhone());location.reload()}">🗑️ 清除学习记录</div>
</div>

<div class="modal-overlay" id="keyModal">
  <div class="modal-box">
    <button class="modal-close" onclick="closeKeyModal()">&times;</button>
    <h3>🔑 输入密钥解锁完整版</h3>
    <div id="keyModalContent"></div>
  </div>
</div>
<div class="modal-overlay" id="syncModal">
  <div class="modal-box">
    <button class="modal-close" onclick="closeSyncModal()">&times;</button>
    <h3>🔄 同步学习记录</h3>
    <div id="syncModalContent"></div>
  </div>
</div>
<div class="main">
  <div class="page active" id="homePage"><div id="homeContent"></div></div>
  <div class="page" id="practicePage"><div id="practiceContent"></div></div>
  <div class="page" id="examPage"><div id="examContent"></div></div>
  <div class="page" id="wrongPage"><div id="wrongContent"></div></div>
  <div class="page" id="favPage"><div id="favContent"></div></div>
</div>

<div class="tab-bar">
  <div class="tab-item active" onclick="switchTab('home')"><span class="icon">🏠</span><span class="label">首页</span></div>
  <div class="tab-item" id="tab-practice" onclick="switchTab('practice')"><span class="icon">📝</span><span class="label">刷题</span></div>
  <div class="tab-item locked" id="tab-exam" onclick="onLockedTabClick('exam')"><span class="icon">🎯</span><span class="label">模考</span></div>
  <div class="tab-item locked" id="tab-wrong" onclick="onLockedTabClick('wrong')"><span class="icon">❌</span><span class="label">错题</span></div>
  <div class="tab-item locked" id="tab-fav" onclick="onLockedTabClick('fav')"><span class="icon">⭐</span><span class="label">收藏</span></div>
</div>

// === 持久化 ===
const LS_KEY_BASE = 'qbank_v7_';
const USER_KEY = 'qbank_current_phone';

function getCurrentUser() {
  return localStorage.getItem(USER_KEY) || '';
}

function getCurrentPhone() {
  return localStorage.getItem(USER_KEY) || '';
}

function isUnlocked() {
  const phone = getCurrentPhone();
  if (!phone) return false;
  return localStorage.getItem('qbank_key_' + phone) === '1';
}

function unlockWithKey(phone, key) {
  const expectedKey = generateKey(phone);
  if (key === expectedKey) {
    localStorage.setItem('qbank_key_' + phone, '1');
    return true;
  }
  return false;
}

function generateKey(phone) {
  var salt = "QMS2026TL";
  var str = phone + salt;
  var hash = 0;
  for (var i = 0; i < str.length; i++) {
    hash = ((hash << 5) - hash) + str.charCodeAt(i);
    hash = hash & hash;
  }
  var key = Math.abs(hash % 900000 + 100000);
  return key.toString();
}
function setCurrentUser(name) {
  localStorage.setItem(USER_KEY, name);
}
function getLSKey() {
  const u = getCurrentUser();
  return LS_KEY_BASE + currentBankId + '_' + (u ? u : '__default__');
}
function getAllUsers() {
  const users = new Set();
  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    // v7 format: qbank_v7_{bankId}_{phone}
    if (key && key.startsWith('qbank_v7_')) {
      const rest = key.substring('qbank_v7_'.length);
      // Extract phone after bankId_
      const parts = rest.split('_');
      if (parts.length >= 2) {
        const phone = parts.slice(1).join('_');
        if (phone && phone !== '__default__') users.add(phone);
      }
    }
    // v6 migration
    if (key && key.startsWith('qbank_v6_')) {
      const uname = key.substring('qbank_v6_'.length);
      if (uname && uname !== '__default__') users.add(uname);
    }
  }
  return [...users];
}
const LS_KEY = getLSKey();
function loadLS() { try { return JSON.parse(localStorage.getItem(getLSKey())) || {}; } catch(e) { return {}; } }
function saveLS(s) { try { localStorage.setItem(getLSKey(), JSON.stringify(s)); } catch(e) {} try { debouncedPush(); } catch(e) {} }
function loadLSForUser(userName) { try { const k = LS_KEY_BASE + currentBankId + '_' + (userName || '__default__'); return JSON.parse(localStorage.getItem(k)) || {}; } catch(e) { return {}; } }
function migrateLegacyData() {
  const phone = getCurrentPhone();
  if (!phone) return;
  // Migrate v6 to v7_cy (creative planning was the original)
  const v6Key = 'qbank_v6_' + phone;
  const v7cyKey = 'qbank_v7_cy_' + phone;
  const v6Data = localStorage.getItem(v6Key);
  if (v6Data && !localStorage.getItem(v7cyKey)) {
    localStorage.setItem(v7cyKey, v6Data);
    localStorage.removeItem(v6Key);
  }
  // Migrate qbank_v4/v5 to v7_cy
  const v4Key = 'qbank_v4';
  const v4Data = localStorage.getItem(v4Key);
  if (v4Data && !localStorage.getItem(v7cyKey)) {
    localStorage.setItem(v7cyKey, v4Data);
    localStorage.removeItem(v4Key);
  }
  const v5Key = 'qbank_v5_' + phone;
  const v5Data = localStorage.getItem(v5Key);
  if (v5Data && !localStorage.getItem(v7cyKey)) {
    localStorage.setItem(v7cyKey, v5Data);
  }
}
function getState() {

}

function getFilteredQuestions() {
  return Q.data.filter(q => {
    if (pFilter.module !== 'all' && q.m !== pFilter.module) return false;
    if (pFilter.type !== 'all' && q.t !== pFilter.type) return false;
    return true;
  });
}

function renderPractice() {
  if (redoWrongMode) { renderRedoWrong(); return; }
  const modules = ['all', ...new Set(Q.data.map(q => q.m))];
  const isLocked = !isUnlocked();
  var typeOptions = [{v:'all',l:'全部'},{v:'j',l:'判断'}];
  if (!isLocked) {
    typeOptions.push({v:'s',l:'单选'},{v:'m',l:'多选'});
  }
  // Auto switch to judge if locked and current filter is not judge
  if (isLocked && pFilter.type !== 'all' && pFilter.type !== 'j') {
    pFilter.type = 'j';
  }
  // 统计筛选后的已做/未做
  const qs = getFilteredQuestions();
  const doneInFilter = qs.filter(q => state.done.includes(q.id)).length;
  const notDoneInFilter = qs.length - doneInFilter;
  let html = `<div class="filter-bar">`;
  modules.forEach(m => {
    html += `<div class="filter-chip ${pFilter.module===m?'active':''}" onclick="setFilter('module','${m}')">${m==='all'?'全部':m}</div>`;
  });
  html += `</div><div class="filter-bar">`;
  typeOptions.forEach(t => {
    html += `<div class="filter-chip ${pFilter.type===t.v?'active':''}" onclick="setFilter('type','${t.v}')">${t.l}</div>`;
  });
  // 添加锁定的选项
  if (isLocked) {
    html += `<div class="filter-chip locked" onclick="showKeyInputModal()">🔒 单选</div>`;
    html += `<div class="filter-chip locked" onclick="showKeyInputModal()">🔒 多选</div>`;
  }
  html += `</div>`;
  // 快捷筛选按钮
  html += `<div class="filter-bar">
    <div class="filter-chip" style="background:#ebf8ff;color:#2b6cb0" onclick="filterUndone()">📋 只看未做 (${notDoneInFilter})</div>
    <div class="filter-chip" style="background:#f0fff4;color:#276749" onclick="filterDone()">✅ 只看已做 (${doneInFilter})</div>
  </div>`;
  if (qs.length === 0) {
    html += `<div class="note">暂无题目</div>`;
  } else {
    if (pIdx >= qs.length) pIdx = 0;
    html += renderQuestionCard(qs[pIdx], pIdx, qs.length, false);
    html += `<div class="nav-row">
      <button class="nav-btn" ${pIdx===0?'disabled':''} onclick="pIdx--;pAnswered=false;pUserAns=null;renderPractice()">上一题</button>
      <span class="nav-counter">${pIdx+1}/${qs.length}${state.done.includes(qs[pIdx].id)?' ✅已做':''}</span>
      <button class="nav-btn" ${pIdx>=qs.length-1?'disabled':''} onclick="pIdx++;pAnswered=false;pUserAns=null;renderPractice()">下一题</button>
    </div>`;
  }
  document.getElementById('practiceContent').innerHTML = html;
}

let _showDoneFilter = null; // null=全部, 'undone'=未做, 'done'=已做
function filterUndone() { _showDoneFilter = 'undone'; pIdx = 0; pAnswered = false; pUserAns = null; renderPractice(); }
function filterDone() { _showDoneFilter = 'done'; pIdx = 0; pAnswered = false; pUserAns = null; renderPractice(); }

// 重写getFilteredQuestions支持已做/未做筛选
const _origGetFiltered = getFilteredQuestions;
getFilteredQuestions = function() {
  let qs = _origGetFiltered();
  if (_showDoneFilter === 'undone') qs = qs.filter(q => !state.done.includes(q.id));
  else if (_showDoneFilter === 'done') qs = qs.filter(q => state.done.includes(q.id));
  return qs;
};

function setFilter(key, val) {
  pFilter[key] = val;
  _showDoneFilter = null;
  pIdx = 0;
  pAnswered = false;
  pUserAns = null;
  state.lastModule = pFilter.module;
  state.lastType = pFilter.type;

function renderQuestionCard(q, idx, total, isRedo) {
  const isFav = state.fav.includes(q.id);
  const isDone = state.done.includes(q.id);
  const prevRecord = state.doneMap[q.id];
  let html = `<div class="question-card" data-id="${q.id}">
    <div class="q-meta">
      <span class="q-tag module">${q.m}</span>
      <span class="q-tag">${Q.getType(q.t)}</span>
      ${q.s ? '<span class="q-tag verified">✅ 标准</span>' : '<span class="q-tag ai">📋 参考</span>'}
      ${isDone && !pAnswered ? '<span class="q-tag done-tag">📌 已做</span>' : ''}
    </div>
    <div class="q-content">${idx+1}. ${q.c}</div>`;
  const answered = isRedo ? redoWrongAnswered : pAnswered;
  const userAns = isRedo ? redoWrongUserAns : pUserAns;
  if (q.t === 'j') {
    html += `<div class="judge-btns">
      <button class="judge-btn ${answered&&userAns==='√'?(q.a==='√'?'correct':'wrong'):''}" onclick="${isRedo?'redoWrongAnswer':'answerJudge'}(${q.id},'√')">√ 正确</button>
      <button class="judge-btn ${answered&&userAns==='×'?(q.a==='×'?'correct':'wrong'):''}" onclick="${isRedo?'redoWrongAnswer':'answerJudge'}(${q.id},'×')">× 错误</button>
    </div>`;
  } else {
    html += `<div class="options">`;
    const ansLetters = q.a ? q.a.split('') : [];
    q.o.forEach(opt => {
      const sel = answered && userAns && userAns.includes(opt[0]);
      const isCor = q.a && ansLetters.includes(opt[0]);
      let cls = 'option-btn';
      if (answered && sel) cls += isCor ? ' correct' : ' wrong';
      else if (answered && isCor && !sel && q.t === 's') cls += ' correct';
      html += `<button class="${cls}" onclick="${isRedo?'redoWrongOpt':'answerOption'}(${q.id},'${opt[0]}')">
        <span class="letter">${opt[0]}</span><span>${opt[1]}</span>
      </button>`;
    });
    html += `</div>`;
    if (q.t === 'm' && userAns && !answered) {
      html += `<button class="multi-submit" onclick="${isRedo?'submitRedoWrongMulti':'submitMulti'}(${q.id})">确认提交</button>`;
    }
  }
  if (answered) {
    html += `<div class="answer-reveal">
      <span class="answer-badge ${q.s?'standard':'ai-ref'}">${q.s?'✅ 标准答案':'📋 参考答案'}</span>
      正确答案：<b>${q.a||'无'}</b>
      ${userAns && userAns !== q.a ? ' | 你的答案：<b style="color:var(--error)">'+userAns+'</b>' : ''}
    </div>`;
    if (q.e && q.e.length > 2) {
      const expCls = q.s ? '' : ' ai';
      html += `<div class="explanation-box${expCls}" id="exp_${q.id}" style="display:none">${q.e}</div>
        <div class="q-actions"><button class="q-action-btn" onclick="toggleExp(${q.id})">📖 查看解析</button></div>`;
    }
  } else if (isDone && prevRecord) {
    // 未答题但之前做过，显示上次的记录
    html += `<div class="answer-reveal" style="opacity:.7">
      <span class="q-tag done-tag">上次作答</span> 你的答案：<b>${prevRecord.ua}</b> | 正确答案：<b>${prevRecord.ca}</b> ${prevRecord.ua===prevRecord.ca?'✅':'❌'}
    </div>`;
  }
  html += `<div class="q-actions">
    <button class="q-action-btn ${isFav?'active':''}" onclick="toggleFav(${q.id})">${isFav?'⭐ 已收藏':'☆ 收藏'}</button>
  </div></div>`;
  return html;
}

function toggleExp(id) {
  const prefix = String(id);
  const el = document.getElementById(prefix.startsWith('exp_') || prefix.startsWith('wexp_') || prefix.startsWith('fexp_') ? id : 'exp_' + id);
  if (el) el.style.display = el.style.display === 'none' ? 'block' : 'none';
}

// === 答题逻辑 ===
function recordAnswer(qId, userAns) {
  const q = Q.data.find(x => x.id === qId);
  if (!q) return;
  state.stats.total++;
  // 记录已做
  if (!state.done.includes(qId)) state.done.push(qId);
  state.doneMap[qId] = { ua: userAns, ca: q.a, t: q.t };
  // 判断对错
  const correct = (q.t === 'm') 
    ? userAns.split('').sort().join('') === q.a.split('').sort().join('')
    : userAns === q.a;
  if (correct) {
    state.stats.correct++;
    state.wrong = state.wrong.filter(x => x !== qId);
  } else {
    if (!state.wrong.includes(qId)) state.wrong.push(qId);
  }
  saveLS(state);
}

function answerJudge(qId, ans) {
  if (pAnswered) return;
  pAnswered = true;
  pUserAns = ans;
  recordAnswer(qId, ans);
  renderPractice();
}

function answerOption(qId, letter) {
  const q = Q.data.find(x => x.id === qId);
  if (!q || pAnswered) return;
  if (q.t === 's') {
    pAnswered = true;
    pUserAns = letter;
    recordAnswer(qId, letter);
  } else {

}

function redoWrongAnswer(qId, ans) {

// === 模拟考 ===
function startExam() {
  const stdJ = Q.data.filter(q => q.t === 'j' && q.s);
  const stdS = Q.data.filter(q => q.t === 's' && q.s);
  const stdM = Q.data.filter(q => q.t === 'm' && q.s);
  const aiJ = Q.data.filter(q => q.t === 'j' && !q.s);
  const aiS = Q.data.filter(q => q.t === 's' && !q.s);
  const aiM = Q.data.filter(q => q.t === 'm' && !q.s);
  function pick(arr, n) { return [...arr].sort(() => Math.random() - 0.5).slice(0, n); }
  let jqs = [...pick(stdJ,30),...pick(aiJ,Math.max(0,30-stdJ.length))].slice(0,30);
  let sqs = [...pick(stdS,50),...pick(aiS,Math.max(0,50-stdS.length))].slice(0,50);
  let mqs = [...pick(stdM,10),...pick(aiM,Math.max(0,10-stdM.length))].slice(0,10);
  examQuestions = [...jqs,...sqs,...mqs];
  examIdx = 0; examAnswers = {}; examTime = 5400; examSubmitted = false; examMode = true;
  switchTab('exam');
  if (examTimer) clearInterval(examTimer);
  examTimer = setInterval(() => {
    examTime--;
    const el = document.getElementById('examTimer');
    if (el) { const m=Math.floor(examTime/60),s=examTime%60; el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0'); }
    if (examTime <= 0) { clearInterval(examTimer); submitExam(); }
  }, 1000);
}

  if (examSubmitted) return;

  renderExam();
}

  examSubmitted = true; examMode = false;

    const myAns = examAnswers[q.id];

  renderExamResult();
}

// === 云同步功能 ===
const CLOUD_API = 'https://api.restful-api.dev/objects';
function fetchWithTimeout(url, opts, ms) {
  ms = ms || 8000;
  opts = opts || {};
  var ctrl = new AbortController();
  opts.signal = ctrl.signal;
  var timer = setTimeout(function() { ctrl.abort(); }, ms);
  return fetch(url, opts).then(function(r) {
    clearTimeout(timer);
    return r;
  }).catch(function(e) {
    clearTimeout(timer);
    throw e;
  });
}
let _syncTimer = null;
let _lastSyncTs = 0;
let _syncStatus = 'idle';
let _cloudObjId = null; // cached object ID

function getCloudObjId(phone) {
  var REGISTRY_ID = 'ff8081819d82fab6019e9124e7a637b4';
  // Check localStorage cache first
  var cached = localStorage.getItem('qbank_cloud_' + currentBankId + '_' + phone);
  if (cached) { _cloudObjId = cached; return Promise.resolve(cached); }
  // Look up in registry
  return fetchWithTimeout(CLOUD_API + '/' + REGISTRY_ID).then(function(r) {
    if (!r.ok) throw new Error('registry fetch failed');
    return r.json();
  }).then(function(reg) {
    var regData = reg.data || {};
    var regKey = currentBankId + '_' + phone;
    if (regData[regKey]) {
      _cloudObjId = regData[regKey];
      localStorage.setItem('qbank_cloud_' + currentBankId + '_' + phone, _cloudObjId);
      return _cloudObjId;
    }
    // Not in registry - create new cloud object
    return fetchWithTimeout(CLOUD_API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: 'qbank-' + currentBankId + '-' + phone, data: { dm: {}, w: [], f: [], st: { total: 0, correct: 0 }, ts: 0 } })
    }).then(function(r) { return r.json(); }).then(function(obj) {
      _cloudObjId = obj.id;
      localStorage.setItem('qbank_cloud_' + currentBankId + '_' + phone, _cloudObjId);
      // Register this phone -> objId mapping
      regData[regKey] = _cloudObjId;
      return fetchWithTimeout(CLOUD_API + '/' + REGISTRY_ID, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: 'qbank-registry', data: regData })
      }).then(function() { return _cloudObjId; });
    });
  });
}

function cloudPull() {
  var phone = getCurrentPhone();
  if (!phone) return Promise.resolve(false);
  _syncStatus = 'syncing'; updateSyncIndicator();
  return getCloudObjId(phone).then(function(objId) {
    return fetchWithTimeout(CLOUD_API + '/' + objId).then(function(r) {
      if (!r.ok) throw new Error('fetch failed');
      return r.json();
    });
  }).then(function(cloudObj) {
    var cloudData = cloudObj.data || cloudObj;
    if (!cloudData.dm && !cloudData.w) { _syncStatus = 'ok'; updateSyncIndicator(); return false; }
    // Only merge if cloud is newer
    var local = loadLS();
    var localTs = local._ts || 0;
    var cloudTs = cloudData.ts || 0;
    if (cloudTs <= localTs && localTs > 0) { _syncStatus = 'ok'; updateSyncIndicator(); return false; }
    var merged = mergeState(local, cloudData);
    merged._ts = Math.max(localTs, cloudTs);
    saveLS(merged);
    state = { done: merged.done || [], wrong: merged.wrong || [], fav: merged.fav || [], doneMap: merged.doneMap || {}, stats: merged.stats || { total: 0, correct: 0 }, lastModule: merged.lastModule || 'all', lastType: merged.lastType || 'all', lastIdx: merged.lastIdx || 0 };
    _lastSyncTs = Date.now(); _syncStatus = 'ok'; updateSyncIndicator();
    return true;
  }).catch(function(e) {
    console.warn('Cloud pull failed:', e);
    _syncStatus = 'error'; updateSyncIndicator();
    setTimeout(function() { if (_syncStatus === 'error') { _syncStatus = 'idle'; updateSyncIndicator(); } }, 15000);
    return false;
  });
}

function cloudPush() {
  var phone = getCurrentPhone();
  if (!phone) return;
  _syncStatus = 'syncing'; updateSyncIndicator();
  var localData = loadLS();
  var pushData = { dm: localData.doneMap || {}, w: localData.wrong || [], f: localData.fav || [], st: localData.stats || { total: 0, correct: 0 }, ts: Date.now() };
  getCloudObjId(phone).then(function(objId) {
    return fetchWithTimeout(CLOUD_API + '/' + objId, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: 'qbank-' + currentBankId + '-' + phone, data: pushData })
    });
  }).then(function() {
    var localData2 = loadLS();
    localData2._ts = pushData.ts;
    try { localStorage.setItem(getLSKey(), JSON.stringify(localData2)); } catch(e) {}
    _lastSyncTs = Date.now(); _syncStatus = 'ok'; updateSyncIndicator();
  }).catch(function(e) {
    console.warn('Cloud push failed:', e);
    _syncStatus = 'error'; updateSyncIndicator();
    setTimeout(function() { if (_syncStatus === 'error') { _syncStatus = 'idle'; updateSyncIndicator(); } }, 15000);
  });
}

function debouncedPush() {
  if (_syncTimer) clearTimeout(_syncTimer);
  _syncTimer = setTimeout(cloudPush, 3000);
}

function updateSyncIndicator() {
  var el = document.getElementById('syncIndicator');
  if (!el) return;
  var icon = '☁️', text = '', color = '#718096';
  if (_syncStatus === 'syncing') { icon = '🔄'; text = '同步中'; color = '#3182ce'; }
  else if (_syncStatus === 'ok') {
    icon = '☁️';
    var ago = _lastSyncTs ? Math.round((Date.now() - _lastSyncTs) / 1000) : -1;
    text = ago < 0 ? '' : ago < 60 ? '已同步' : ago < 3600 ? Math.round(ago/60) + '分钟前' : '已同步';
    color = '#38a169';
  } else if (_syncStatus === 'error') { icon = '☁️'; text = '未同步'; color = '#a0aec0'; }
  el.innerHTML = '<span style="font-size:11px;color:' + color + '">' + icon + (text ? ' ' + text : '') + '</span>';
  var drawerEl = document.getElementById('drawerSyncInfo');
  if (drawerEl) {
    if (_syncStatus === 'ok') drawerEl.textContent = '✅ 上次同步：' + (_lastSyncTs ? new Date(_lastSyncTs).toLocaleTimeString() : '刚刚');
    else if (_syncStatus === 'error') drawerEl.textContent = '☁️ 同步暂不可用，数据已保存在本地';
    else if (_syncStatus === 'syncing') drawerEl.textContent = '🔄 正在同步...';
    else drawerEl.textContent = '☁️ 自动云同步';
  }
}

function manualSync() {
  cloudPull().then(function(ok) {
    if (ok) { switchTab(curTab); }
    cloudPush();
  }).catch(function() {
    // Retry once after 3s
    setTimeout(function() {
      cloudPull().then(function(ok) {
        if (ok) { switchTab(curTab); }
        cloudPush();
      });
    }, 3000);
  });
}

// === 同步功能（手动同步码，备选） ===
function exportSyncCode() {
  const s = loadLS();
  const phone = getCurrentPhone();
  const compact = { v: 7, uid: phone, bank: currentBankId, dm: s.doneMap, w: s.wrong, f: s.fav, st: s.stats };
  try {
    return btoa(unescape(encodeURIComponent(JSON.stringify(compact))));
  } catch(e) {
    return btoa(JSON.stringify(compact));
  }
}

function importSyncCode(code) {
  try {
    const json = decodeURIComponent(escape(atob(code.trim())));
    const data = JSON.parse(json);
    if (!data.dm && !data.d) { alert('同步码无效或格式错误'); return false; }
    const importedUid = data.uid || '';
    const importedBank = data.bank || 'cy';
    const currentUid = getCurrentUser();
    // If sync code belongs to a different user, ask what to do
    if (importedUid && importedUid !== currentUid) {
      const choice = confirm('该同步码属于用户「' + (importedUid||'未命名') + '」\n当前用户是「' + (currentUid||'未命名') + '」\n\n确定 = 切换到该用户并导入\n取消 = 取消导入');
      if (!choice) return false;
      // Switch to imported user
      setCurrentUser(importedUid);
      // Load current state for that user (might be empty)
      const targetState = loadLS();
      // Merge into target user
      const merged = mergeState(targetState, data);
      saveLS(merged);
      state = merged;
      // Reload to refresh UI
      location.reload();
      return true;
    }
    // Same user - merge (switch bank if needed)
    if (importedBank && importedBank !== currentBankId) {
      currentBankId = importedBank;
      localStorage.setItem('qbank_current_bank', currentBankId);
      Q.data = BANKS[currentBankId].data;
    }
    const current = loadLS();
    const merged = mergeState(current, data);
    saveLS(merged);
    state = merged;
    return true;
  } catch(e) {
    alert('同步码无效，请检查是否完整复制');
    return false;
  }
}

function mergeState(current, data) {
  const importedDoneMap = data.dm || {};
  const importedWrong = data.w || [];
  const importedFav = data.f || [];
  const importedStats = data.st || { total: 0, correct: 0 };
  const allDoneIds = Object.keys(importedDoneMap).map(Number);
  const currentDoneIds = current.done || [];
  const mergedDone = [...new Set([...currentDoneIds, ...allDoneIds])];
  const mergedDoneMap = { ...current.doneMap, ...importedDoneMap };
  const mergedWrong = [...new Set([...(current.wrong || []), ...importedWrong])];
  const mergedFav = [...new Set([...(current.fav || []), ...importedFav])];
  const mergedStats = {
    total: Math.max((current.stats||{}).total||0, importedStats.total),
    correct: Math.max((current.stats||{}).correct||0, importedStats.correct)
  };
  return { done: mergedDone, doneMap: mergedDoneMap, wrong: mergedWrong, fav: mergedFav, stats: mergedStats, lastModule: current.lastModule, lastType: current.lastType, lastIdx: current.lastIdx };
}

function closeSyncModal() {
  document.getElementById('syncModal').classList.remove('active');
}

function copySyncCode() {
  var area = document.getElementById('exportArea');
  // Method 1: Modern Clipboard API (needs HTTPS, may fail on file://)
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(area.value).then(function() {
      alert('✅ 同步码已复制');
    }).catch(function() {
      // Fallback to execCommand
      fallbackCopy(area);
    });
    return;
  }
  // Method 2: execCommand fallback
  fallbackCopy(area);
}

function fallbackCopy(area) {
  area.select();
  area.setSelectionRange(0, 99999);
  var ok = false;
  try { ok = document.execCommand('copy'); } catch(e) {}
  if (ok) {
    alert('✅ 同步码已复制');
  } else {
    // Last resort: prompt user to manually copy
    area.select();
    area.setSelectionRange(0, 99999);
    alert('请长按文本框 → 全选 → 复制');
  }
}

function doImport() {
  var code = document.getElementById('importArea').value.trim();
  if (!code) { alert('请先粘贴同步码'); return; }
  if (importSyncCode(code)) {
    alert('✅ 导入成功，进度已合并！');
    closeSyncModal();
    state = getState();
    switchTab('home');
  }
}

function validatePhone(phone) {
  return /^1[3-9]\d{9}$/.test(phone);
}

function completePhoneSetup() {
  var phone = (document.getElementById('firstPhone').value || '').trim();
  if (!validatePhone(phone)) {
    alert('请输入正确的11位手机号（以1开头）');
    return;
  }
  // 检查是否已有密钥
  if (localStorage.getItem('qbank_key_' + phone) === '1') {
    // 已解锁，直接登录
    setCurrentUser(phone);
    location.reload();
  } else {
    // 显示密钥输入步骤
    showKeySetupStep(phone);
  }
}

function completeSetupWithKey(phone) {
  var key = (document.getElementById('setupKey').value || '').trim();
  setCurrentUser(phone);
  if (key) {
    if (unlockWithKey(phone, key)) {
      alert('✅ 密钥正确，已解锁完整版！');
    } else {
      alert('密钥错误，将以免费版登录');
    }
  }
  location.reload();
}

function skipKeySetup(phone) {
  setCurrentUser(phone);
  location.reload();
}

function completeSetup() {
  const name = (document.getElementById('firstUserName').value || '').trim();
  if (!name) { alert('请输入用户名'); return; }
  setCurrentUser(name);
  // Check if there's legacy data to migrate
  const legacy = localStorage.getItem('qbank_v4');
  if (legacy) {
    const newKey = LS_KEY_BASE + name;
    if (!localStorage.getItem(newKey)) {
      localStorage.setItem(newKey, legacy);
      localStorage.removeItem('qbank_v4');
    }
  }
  location.reload();
}
