.tick{font-size:11px;fill:#8a929c;}

#tip{position:fixed;cursor:move;pointer-events:none;background:#111;color:#fff;padding:8px 11px;border-radius:6px;font-size:12px;display:none;white-space:nowrap;z-index:99;line-height:1.7;}

const tip=document.getElementById('tip'),rp=document.getElementById('rp');
let pinnedIdx=null, focusR=null;
function locLine(d){return `经纬度：${d.lat}°N, ${d.lon}°E　海拔：${d.alt} m`;}
function htmlOf(d,kind){return `<b>${d.c}</b>｜${d.r}｜${d.p}<br>${kind}：X=${d.x}　Y=${d.y}<br>${locLine(d)}`;}
function showTip(html,x,y){tip.innerHTML=html;tip.style.display='block';tip.style.left=(x+14)+'px';tip.style.top=(y-10)+'px';}
function applyFocus(){document.querySelectorAll('circle.pt').forEach(c=>{c.classList.toggle('dim',!!focusR && !c.classList.contains('r-'+focusR));});}
function clearPins(){pinnedIdx=null;document.querySelectorAll('circle.pt').forEach(c=>c.classList.remove('pulse'));tip.style.display='none';}
function pinIndex(idx){
  clearPins();pinnedIdx=idx;
  const ct=document.querySelector('#svg-t circle.pt[data-i="'+idx+'"]');
  const ch=document.querySelector('#svg-h circle.pt[data-i="'+idx+'"]');
  ct.classList.add('pulse');ch.classList.add('pulse');
  const dt=T[idx],dh=H[idx];
  showTip(`<b>${dt.c}</b>｜${dt.r}｜${dt.p}<br>冷暖：X=${dt.x}　Y=${dt.y}<br>燥湿：X=${dh.x}　Y=${dh.y}<br>${locLine(dt)}`,ct.getBoundingClientRect().left,ct.getBoundingClientRect().top);
}
function bind(svgId,data,kind){
  const svg=document.getElementById(svgId);
  svg.querySelectorAll('circle.pt').forEach(c=>{
    const i=+c.dataset.i;
    c.addEventListener('mouseenter',e=>{if(pinnedIdx!==null)return;showTip(htmlOf(data[i],kind),e.clientX,e.clientY);});
    c.addEventListener('mousemove',e=>{if(pinnedIdx===null)showTip(htmlOf(data[i],kind),e.clientX,e.clientY);});
    c.addEventListener('mouseleave',()=>{if(pinnedIdx===null)tip.style.display='none';});
    c.addEventListener('click',()=>pinIndex(i));
  });
}
function locateAll(){
  const q=document.getElementById('inAll').value.trim();
  if(!q)return;
  const idx=T.findIndex(d=>d.c.includes(q));
  if(idx<0){alert('未找到包含「'+q+'」的城市');return;}
  pinIndex(idx);
}
function resetAll(){clearPins();focusR=null;rp.style.display='none';document.querySelectorAll('.lg').forEach(x=>x.style.outline='');document.getElementById('inAll').value='';applyFocus();}
document.querySelectorAll('.lg').forEach(el=>{

    const r=el.dataset.r;
    if(focusR===r){focusR=null;rp.style.display='none';el.style.outline='';}
    else{
      focusR=r;
      rp.innerHTML=`<b>${r}</b>（点击任意处关闭）<br>包含：${PROV[r]}`;
      rp.style.display='block';
      rp.style.left=Math.min(e.clientX+12,window.innerWidth-340)+'px';
      rp.style.top=(e.clientY+12)+'px';
      document.querySelectorAll('.lg').forEach(x=>x.style.outline='');
      el.style.outline='2px solid #1F97B9';
    }
    applyFocus();e.stopPropagation();
  });
});
document.addEventListener('click',e=>{
  if(focusR && !e.target.closest('.lg') && !e.target.closest('#rp')){
    focusR=null;rp.style.display='none';document.querySelectorAll('.lg').forEach(x=>x.style.outline='');applyFocus();
  }
});
tip.addEventListener('mousedown',function(e){
  e.preventDefault();
  var sx=e.clientX-tip.offsetLeft, sy=e.clientY-tip.offsetTop;
  function mv(ev){tip.style.left=(ev.clientX-sx)+'px';tip.style.top=(ev.clientY-sy)+'px';}
  function up(){document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);}

});
